# 管理后台由顶部 nginx 以 /admin/ 前缀转发，此容器内请求已去掉 /admin/ 前缀
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
